<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Dailycatch logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Logo typographique pour l'application mobile Dailycatch, thème pêche, palette bleu et vert eau</desc>
  <defs>
    
  <mask id="imagine-text-gaps-cqcjaw" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="680" height="460" fill="white"/><rect x="271.6312561035156" y="129.8000030517578" width="136.7375030517578" height="33.60000038146973" fill="black" rx="2"/><rect x="239.7624969482422" y="157.60000610351562" width="200.47500610351562" height="92" fill="black" rx="2"/><rect x="198.52500915527344" y="286.8000183105469" width="282.95001220703125" height="18.40000057220459" fill="black" rx="2"/><rect x="285.4875183105469" y="348.3999938964844" width="108.2249984741211" height="16.800000190734863" fill="black" rx="2"/><rect x="319.6312561035156" y="377.8000183105469" width="40.73749923706055" height="33.60000038146973" fill="black" rx="2"/></mask></defs>

  <!-- Background card -->
  <rect x="40" y="20" width="600" height="420" rx="20" fill="#0B2E4E" style="fill:rgb(11, 46, 78);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Subtle water ripple lines -->
  <ellipse cx="340" cy="380" rx="260" ry="18" fill="none" stroke="#1A7F8E" stroke-width="0.8" opacity="0.35" style="fill:none;stroke:rgb(26, 127, 142);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.35;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="340" cy="370" rx="200" ry="12" fill="none" stroke="#1A7F8E" stroke-width="0.6" opacity="0.2" style="fill:none;stroke:rgb(26, 127, 142);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.2;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="340" cy="390" rx="220" ry="10" fill="none" stroke="#4EC9B0" stroke-width="0.5" opacity="0.15" style="fill:none;stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.15;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === LOGO PRINCIPAL === -->

  <!-- "daily" en vert eau léger -->
  <text x="340" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#4EC9B0" text-anchor="middle" letter-spacing="10" opacity="0.9" style="fill:rgb(78, 201, 176);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:26px;font-weight:400;text-anchor:middle;dominant-baseline:auto">DAILY</text>

  <!-- "catch" grand wordmark -->
  <text x="340" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="400" fill="#F5F9FA" text-anchor="middle" letter-spacing="2" style="fill:rgb(245, 249, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:78px;font-weight:400;text-anchor:middle;dominant-baseline:auto">catch</text>

  <!-- Ligne décorative sous le texte — évoque une ligne de pêche -->
  <line x1="160" y1="250" x2="340" y2="250" stroke="#1A7F8E" stroke-width="1.2" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(26, 127, 142);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="340" y1="250" x2="520" y2="250" stroke="#1A7F8E" stroke-width="1.2" opacity="0.6" style="fill:rgb(0, 0, 0);stroke:rgb(26, 127, 142);color:rgb(255, 255, 255);stroke-width:1.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.6;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Hameçon SVG au-dessus du "i" dans catch — position centrée sur le i -->
  <!-- Le 'i' de catch est approximativement à x=290 -->
  <!-- Hameçon stylisé : tige + courbe + pointe -->
  <g transform="translate(288, 148)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <!-- Tige verticale -->
    <line x1="0" y1="0" x2="0" y2="28" stroke="#4EC9B0" stroke-width="2.5" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- Anneau du haut -->
    <circle cx="0" cy="-4" r="4" fill="none" stroke="#4EC9B0" stroke-width="2.2" style="fill:none;stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:2.2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- Courbe de l'hameçon -->
    <path d="M0 28 Q12 44 6 56 Q0 66 -8 60" fill="none" stroke="#4EC9B0" stroke-width="2.5" stroke-linecap="round" style="fill:none;stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <!-- Pointe -->
    <path d="M-8 60 L-4 52" fill="none" stroke="#4EC9B0" stroke-width="2" stroke-linecap="round" style="fill:none;stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- Ligne de pêche depuis l'hameçon vers la droite -->
  <path d="M288 148 Q360 130 430 145" fill="none" stroke="#4EC9B0" stroke-width="1" stroke-dasharray="3,4" opacity="0.55" mask="url(#imagine-text-gaps-cqcjaw)" style="fill:none;stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:1px;stroke-dasharray:3px, 4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.55;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Tagline -->
  <text x="340" y="300" font-family="'DM Sans', Arial, sans-serif" font-size="13" font-weight="300" fill="#4EC9B0" text-anchor="middle" letter-spacing="5" opacity="0.75" style="fill:rgb(78, 201, 176);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.75;font-family:&quot;DM Sans&quot;, Arial, sans-serif;font-size:13px;font-weight:300;text-anchor:middle;dominant-baseline:auto">YOUR DAILY FISHING LOG</text>

  <!-- Séparateur -->
  <line x1="290" y1="318" x2="390" y2="318" stroke="#1A7F8E" stroke-width="0.6" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(26, 127, 142);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === VERSION ICÔNE === -->
  <text x="340" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="400" fill="#4EC9B0" text-anchor="middle" letter-spacing="6" opacity="0.55" style="fill:rgb(78, 201, 176);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.55;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">APP ICON</text>

  <!-- Icône carrée arrondie -->
  <rect x="290" y="370" width="100" height="52" rx="14" fill="#1A7F8E" opacity="0.9" style="fill:rgb(26, 127, 142);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.9;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- "dc" lettres dans l'icône -->
  <text x="340" y="403" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="400" fill="#F5F9FA" text-anchor="middle" letter-spacing="3" style="fill:rgb(245, 249, 250);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:26px;font-weight:400;text-anchor:middle;dominant-baseline:auto">dc</text>

  <!-- Petit hameçon dans l'icône -->
  <g transform="translate(365, 376)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#4EC9B0" stroke-width="1.8" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <path d="M0 8 Q5 14 3 18 Q0 22 -4 19" fill="none" stroke="#4EC9B0" stroke-width="1.8" stroke-linecap="round" style="fill:none;stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:1.8px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <path d="M-4 19 L-2 15" fill="none" stroke="#4EC9B0" stroke-width="1.5" stroke-linecap="round" style="fill:none;stroke:rgb(78, 201, 176);color:rgb(255, 255, 255);stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

</svg>