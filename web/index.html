<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DailyCatch - sauvez des paniers, reduisez le gaspillage.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DailyCatch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DailyCatch</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #102446; }
    #startup { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; color: white; font: 16px Arial, sans-serif; }
    #startup[hidden] { display: none; }
    #startup h1 { font-size: 28px; }
    #startup button { padding: 12px 20px; border: 0; border-radius: 8px; background: #073e43; color: white; font: inherit; cursor: pointer; }
    #startup button[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="startup" role="status" aria-live="polite" hidden>
    <h1>DailyCatch</h1>
    <p id="startup-message"></p>
    <button id="startup-retry" type="button" hidden>R&eacute;essayer</button>
  </div>
  <script src="startup.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
