name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web debug
        run: flutter build web --debug --no-wasm-dry-run

      - name: Build Android debug
        run: flutter build apk --debug
